services:
  postgres:
    image: postgres:16-alpine
    container_name: practica-postgres
    environment:
      POSTGRES_DB: practica
      POSTGRES_USER: practica
      POSTGRES_PASSWORD: practica
    ports:
      - "5432:5432"
    volumes:
      - practica-postgres-data:/var/lib/postgresql/data
    networks:
      - practica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practica -d practica"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: practica-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/practica
      SPRING_DATASOURCE_USERNAME: practica
      SPRING_DATASOURCE_PASSWORD: practica
      JAVA_OPTS: -Xmx512m -Xms256m
    restart: unless-stopped
    networks:
      - practica-network

networks:
  practica-network:
    driver: bridge

volumes:
  practica-postgres-data:
    driver: local
